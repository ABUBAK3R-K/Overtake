# Fixed, versioned race list for Overtake (PRD FR-1, NFR "Reproducibility").
# Changing this list changes every downstream result — tell your partner first.
#
# All 2023 so tyre compound naming and car regulations are consistent.
# Coverage requirements from PRD Section 11: at least one wet race and
# at least one safety-car-heavy race.
#
# race_id format: <season>_<short_circuit_name>. It is the primary key used
# in every Parquet table, so never rename an existing id.

[[races]]
race_id = "2023_bahrain"
season = 2023
round = 1
why = "Dry baseline, high tyre degradation"

[[races]]
race_id = "2023_australia"
season = 2023
round = 3
why = "Safety-car heavy: three red flags, multiple SC periods"

